name: Release AAB

# Genera el Android App Bundle (.aab) FIRMADO para subir a Google Play.
# Se lanza a mano desde la pestaña "Actions" → "Release AAB" → "Run workflow".
#
# Requiere configurar estos Secrets del repositorio (Settings → Secrets and
# variables → Actions → New repository secret):
#   KEYSTORE_BASE64   -> el keystore .jks codificado en base64
#   KEYSTORE_PASSWORD -> contraseña del almacén
#   KEY_PASSWORD      -> contraseña de la clave (puede ser la misma)
#   KEY_ALIAS         -> alias de la clave (p. ej. "guardianes")
#
# El keystore se reconstruye en el runner y se borra al terminar; nunca se
# almacena en el repositorio.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64. Configúralo en Settings → Secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: guardianes-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
